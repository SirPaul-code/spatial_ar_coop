name: Apply pose v1.0.7 integration

on:
  push:
    branches:
      - feat/person-pose-v107
    paths:
      - tools/apply_pose_v107.py
      - .github/workflows/apply-pose-v107.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/person-pose-v107
          fetch-depth: 0
      - name: Align current HUD text for deterministic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt")
          text = path.read_text()
          old = '"$latestDetectionCount detected · $latestSpatializedCount spatialized · $latestLocalTrackCount active · $ack"'
          new = '"$latestDetectionCount detected · $latestSpatializedCount spatialized · $latestLocalTrackCount active · $ack · $bufferedRemoteTracks remote · ${latestInferenceMs} ms"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"live HUD precondition: expected 1, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply deterministic source patch
        run: python3 tools/apply_pose_v107.py
      - name: Remove one-shot helper
        run: git rm tools/apply_pose_v107.py .github/workflows/apply-pose-v107.yml
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt android/app/src/main/java/com/sirpaul/spatialarcoop/vision/ObjectDetectorEngine.kt
          git commit -m "feat(android): integrate shared person pose skeletons"
          git push origin HEAD:feat/person-pose-v107
