name: Apply participant gizmo patch

on:
  push:
    branches:
      - feature/participant-gizmos
    paths:
      - '.github/workflows/apply-participant-gizmos.yml'
      - 'scripts/apply_participant_gizmos.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/participant-gizmos
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_participant_gizmos.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-participant-gizmos.yml scripts/apply_participant_gizmos.py
          git add android docs/FIELD_USE.md
          git commit -m 'feat(android): add through-wall participant gizmos'
          git push origin HEAD:feature/participant-gizmos
