name: showme-internet-ci

on:
  push:
    branches: [showme/remote-assistance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-release:
    if: "!contains(github.event.head_commit.message, '[stage-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard the existing spatial runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code a5970e9be7fef9434dbf2e681274dc56c9462fe4 -- android/app .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser geometry, frame identity and control tests
        run: node --test showme/web/*.test.mjs
      - name: Browser integration dependencies
        working-directory: showme
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real browser WebRTC and annotation smoke test
        working-directory: showme
        run: npm run test:browser
      - name: Worker zero-config installation, signaling and deploy validation
        working-directory: showme/server
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run test:integration
          npm run check
      - name: Deploy production Worker when repository credentials are available
        working-directory: showme/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            npm run deploy
            echo "Production Worker deployed by CI."
          else
            echo "Cloudflare CI credentials are not configured; validated Worker source is included in the release."
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: ShowMe unit tests, lint and APKs
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :showme:testDebugUnitTest :showme:lintDebug :showme:lintRelease :showme:assembleDebug :showme:assembleRelease 2>&1 | tee ../showme-build.log
      - name: Verify separate application identity and stable trial signing
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED="9e752e4f1ae0d9f1dd72b17a3d72d88e82e54075651dc268657877a0e73eaf3a"
          : > showme-signatures.txt
          for APK in android/showme/build/outputs/apk/debug/showme-debug.apk android/showme/build/outputs/apk/release/showme-release.apk; do
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee -a showme-signatures.txt
            ACTUAL=$("$TOOLS/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate SHA-256 digest:" | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            test "$ACTUAL" = "$EXPECTED"
            "$TOOLS/aapt" dump badging "$APK" | grep "package: name='com.sirpaul.showme'"
          done
          if "$TOOLS/aapt" dump badging android/showme/build/outputs/apk/release/showme-release.apk | grep -q application-debuggable; then exit 1; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showme-diagnostics
          path: |
            showme-build.log
            showme-signatures.txt
            showme/test-results/
            android/showme/build/reports/
            android/showme/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload signed ShowMe APKs
        uses: actions/upload-artifact@v4
        with:
          name: showme-signed-apks
          path: android/showme/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish ShowMe zero-config Internet release
        if: github.ref == 'refs/heads/showme/remote-assistance'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/showme/build/outputs/apk/debug/showme-debug.apk ShowMe-latest-dev.apk
          cp android/showme/build/outputs/apk/release/showme-release.apk ShowMe-latest-release.apk
          sha256sum ShowMe-latest-dev.apk ShowMe-latest-release.apk > SHOWME-SHA256SUMS.txt
          zip -j ShowMe-browser.zip showme/web/index.html showme/web/style.css showme/web/app.js showme/web/geometry.mjs showme/web/live-video.mjs showme/web/remote-session.mjs showme/web/control-rpc.mjs
          zip -r ShowMe-server.zip showme/server -x 'showme/server/node_modules/*' 'showme/server/public/*' 'showme/server/.dry-run/*'
          cat > SHOWME-RELEASE.md <<EOF
          ShowMe zero-config Internet build from \`showme/remote-assistance\` at \`$GITHUB_SHA\`.

          Install \`ShowMe-latest-release.apk\` and tap **Start a call**. There is no activation link, Cloudflare setup, service URL, or secret for the app user. The Android app is bound to the production ShowMe service and registers its installation automatically.

          - Public helper flow: Start a call -> share HTTPS invitation -> owner Allow -> WebRTC Direct/Relay.
          - The Worker keeps the server signing secret and TURN API token server-side; neither is embedded in the APK.
          - Anonymous installation capabilities are server-issued and rate-limited; stale/invalid installation capabilities automatically re-register.
          - Real WebRTC video/audio/data with direct ICE and TURN relay fallback.
          - Worker/Durable Object tests, browser WebRTC smoke tests, Android tests/lint/build and APK signature checks passed.
          - Existing Spatial Sync runtime is unchanged.
          - Physical phone/browser FPS and centimetre placement accuracy still require real-device measurement.
          - This GitHub release still uses the repository trial signing identity; Google Play production distribution should use Play App Signing.
          EOF
          gh release delete showme-latest --cleanup-tag -y || true
          gh release create showme-latest ShowMe-latest-release.apk ShowMe-latest-dev.apk ShowMe-browser.zip ShowMe-server.zip SHOWME-SHA256SUMS.txt showme-signatures.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "ShowMe - zero-config Internet WebRTC assistance" --notes-file SHOWME-RELEASE.md
