name: Server stabilization

on:
  push:
    branches: [stabilization-chatgpt]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/stabilization-server.yml'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-chatgpt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - name: Tests and syntax
        working-directory: server
        run: |
          npm test
          npm run check
      - name: Container build
        run: docker build -t spatial-ar-coop-server:stabilization server
