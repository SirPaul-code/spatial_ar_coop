name: apply-spatial-clients-vehicles

on:
  push:
    branches: [stablear/multiplatform-sdk]
    paths:
      - '.github/workflows/apply-spatial-clients-vehicles.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Spatial Sync patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Keep real receive timestamps for phone poses so stale/disconnected
          # peers disappear instead of living forever in the visualization.
          path = 'android/app/src/main/java/com/sirpaul/spatialnomap/WorldViz.kt'
