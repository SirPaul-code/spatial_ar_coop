name: apply-spatial-clients-vehicles

on:
  push:
    branches: [stablear/multiplatform-sdk]
    paths:
      - '.github/workflows/apply-spatial-clients-vehicles.yml'
      - '.github/scripts/apply_vehicle_final.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final vehicle tracking pass
        run: python3 .github/scripts/apply_vehicle_final.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Test and build final Spatial Sync
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/models/xfeat.tflite'
          cp android/app/build/outputs/apk/debug/app-debug.apk SpatialAR-StableAR-latest.apk
          sha256sum SpatialAR-StableAR-latest.apk | tee SPATIAL-STABLEAR-SHA256SUMS.txt

      - name: Commit verified final vehicle pass
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android/app/src/main/java/com/sirpaul/spatialnomap/VehicleDetector.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/VehicleGeometryPolicy.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/VehicleWireMetadata.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/VehicleTrackPolicy.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/ArRenderer.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/AlignmentCoordinator.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/MainActivity.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/WorldViz.kt \
            android/app/src/test/java/com/sirpaul/spatialnomap/VehicleTrackPolicyTest.kt \
            android/app/src/test/java/com/sirpaul/spatialnomap/VehicleGeometryPolicyTest.kt \
            android/app/src/test/java/com/sirpaul/spatialnomap/VehicleWireMetadataTest.kt \
            sdk/checkpoints/SPATIAL_SYNC_VEHICLE_FINAL_2026-09-15.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(spatial-sync): harden real-time vehicle tracking'
            git push origin HEAD:stablear/multiplatform-sdk
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish verified Spatial Sync APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: spatial-stablear-latest
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            SpatialAR-StableAR-latest.apk \
            SPATIAL-STABLEAR-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Spatial AR + StableAR - Android latest" \
            --prerelease \
            --notes "Final vehicle-tracking pass: high-rate latest-frame detection, depth-independent detection fallback, class-prior 3D cuboid fitting, stable yaw estimation without depth PCA, shared orientation metadata, velocity-aware association, canonical cross-device deduplication/keepalive, and peer phone tracking. Unit tests and assembleDebug passed in this publishing workflow."
