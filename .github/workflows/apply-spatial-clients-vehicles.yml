                                  lastSeenMs = now,
                              )
                          }
                      }
                  }

                  return Snapshot(
                      points = points,
                      actors = actors,
                      targets = localTargets.values.map { it.copy(position = it.position.copyOf()) } +
                          remoteTargets.values.map { it.copy(position = it.position.copyOf()) },
          ''',
          '''        val actors = ArrayList<VizActor>(2)
