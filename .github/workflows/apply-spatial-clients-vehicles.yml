name: apply-spatial-clients-vehicles

on:
  push:
    branches: [stablear/multiplatform-sdk]
    paths:
      - '.github/workflows/apply-spatial-clients-vehicles.yml'
      - '.github/scripts/apply_spatial_clients_vehicles.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Spatial Sync feature patch
        run: python3 .github/scripts/apply_spatial_clients_vehicles.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v3

      - name: Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Test and build patched Spatial Sync
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/models/xfeat.tflite'

      - name: Commit verified feature patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android/app/src/main/java/com/sirpaul/spatialnomap/WorldViz.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/BirdEyeWorldView.kt \
            android/app/src/main/java/com/sirpaul/spatialnomap/ArRenderer.kt \
            .github/workflows/spatial-stablear-release.yml \
            sdk/checkpoints/SPATIAL_SYNC_CLIENTS_VEHICLES_2026-09-14.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No feature changes to commit.'
            exit 0
          fi
          git commit -m 'feat(spatial-sync): track peer phones and fuse shared vehicles'
          git push origin HEAD:stablear/multiplatform-sdk
