                          val mappedPosition = transformPoint(transform, frame.pose.t)
                          val mappedQuaternion = transformQuaternion(transform, frame.pose.q)
                          if (mappedPosition != null && mappedQuaternion != null) {
                              actors += VizActor(
                                  id = "peer",
