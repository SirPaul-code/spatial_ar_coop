          checkpoint.write_text('''# Spatial Sync client + vehicle tracking checkpoint — 2026-09-14

## Intent

This checkpoint adds the missing product-level client visualization and tightens the existing dynamic vehicle sharing semantics on `stablear/multiplatform-sdk`.

## Verified architecture before this change

- `WifiAwarePeerTransport` is still an **exactly-two-phone** direct Wi-Fi Aware transport. `SharedRoomState` contains an N-phone/star model but it is not wired into the active transport yet. Do not claim N-client networking from this checkpoint.
- Vehicle detection already had detector-local motion tracks, shared room IDs, cross-device spatial association and deterministic duplicate winner selection.
- The missing behavior was that a local detection matching a remote reservation was discarded instead of contributing an observation to the same canonical vehicle ID.
- `WorldVizBus` previously stored one local + one remote frame and stamped actor `lastSeenMs` at snapshot time, so a stale peer could look permanently alive.
- WORLD was installed outside `MainActivity` safe-area handling with a fixed 14 dp bottom margin.

## Changes

1. **Client phone tracking UI**
   - A `CLIENTS ON/OFF` control is placed beside WORLD.
   - Both controls use Android system-bar/display-cutout insets.
   - Remote AR-camera pose is rendered in the normal AR overlay as `CLIENT • <name>` with a small projected 3D phone bounding box.
   - Bird-eye view renders the remote client as an oriented phone footprint/bounding box instead of only a triangle.
   - Client pose expires after 3 s without a fresh remote frame.

2. **Shared vehicle lifecycle**
   - A second phone that sees an already-reserved vehicle now reuses the canonical shared ID and re-broadcasts its observation under that ID.
   - This means either camera can keep the same logical vehicle alive; no second car is created merely because the other phone starts seeing it.
   - The dynamic target expires only after observations from both sides stop, with a 4 s grace/memory TTL.
   - World visualization merges same-ID local/remote dynamic messages into one logical target.

3. **Release path**
   - `spatial-stablear-release.yml` now rebuilds/publishes the APK when these Spatial Sync feature files change.

## Validation performed by the applying workflow

The applying workflow must pass:

```text
gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
```

before it commits this patch.

## Physical acceptance still required

- Two phones: `ALIGNING -> LOCKED`.
- CLIENTS ON: A sees B's phone box follow B's movement; B sees A.
- CLIENTS OFF: peer box disappears without affecting POIs/vehicles.
- Android gesture/navigation bar does not overlap WORLD/CLIENTS.
- Vehicle first seen by A gets one ID; when B also sees it, target count remains one and ID stays canonical.
- A turns away while B keeps car visible: vehicle remains loaded.
- B also turns away: vehicle disappears after the bounded grace TTL.
- Reacquire the same moving car after expiry: it may legitimately receive a new track ID.

## Next architecture step (not implemented here)

To support >2 simultaneous clients, replace the single-socket `WifiAwarePeerTransport` session with host-side per-peer sessions and wire `SharedRoomState` into fan-out/fan-in. The current UI/state code is intentionally compatible with a future list of actors, but this checkpoint does not pretend the transport is already N-peer.
''')
