          ''',
          '''            --notes "Latest installable Spatial Sync Android build from stablear/multiplatform-sdk. Includes full StableAR material tracking, shared-world client phone overlay, navigation-inset-safe WORLD/CLIENTS controls, and cross-device canonical vehicle observation fusion/deduplication. Development sideload build; physical two-phone acceptance remains the next validation gate."
