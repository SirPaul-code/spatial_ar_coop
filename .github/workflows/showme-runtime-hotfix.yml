name: showme-runtime-hotfix

on:
  push:
    branches: [showme/remote-assistance]
    paths: [.github/workflows/showme-runtime-hotfix.yml]

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime startup hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          activity = "android/showme/src/main/java/com/sirpaul/showme/ShowMeActivity.kt"
          renderer = "android/showme/src/main/java/com/sirpaul/showme/ShowMeRenderer.kt"

          replace_once(activity,
              '    private var pendingApproval: Pair<String,String>? = null\n',
              '    private var pendingApproval: Pair<String,String>? = null\n    private var pendingInviteDialog = false\n')

          replace_once(activity,
              '''        starting=true\n        if(local){launchLocal();return}\n        notice("Starting your call...")\n        val connection=RemoteHostConnection(state,voice,{id,name->runOnUiThread { requestApproval(id,name) }},{text->notice(text)})\n''',
              '''        starting=true\n        if(local){launchLocal();return}\n        // Camera preview is the call screen. Do not block it on signaling or Worker latency.\n        renderer.action("clear")\n        home.visibility=View.GONE\n        statusText.text="Starting call"\n        notice("Starting your call...")\n        val connection=RemoteHostConnection(state,voice,{id,name->runOnUiThread { requestApproval(id,name) }},{text->notice(text)})\n''')

          replace_once(activity,
              '''                if(destroyed){connection.stop();return@runOnUiThread}\n                invite=url;starting=false;startedAt=monotonicMs();renderer.action("clear");home.visibility=View.GONE\n                state.paused=!foreground;inviteDialog()\n''',
              '''                if(destroyed||isFinishing){connection.stop();return@runOnUiThread}\n                invite=url;starting=false;startedAt=monotonicMs()\n                state.paused=!foreground\n                if(foreground)inviteDialog() else pendingInviteDialog=true\n''')

          replace_once(activity,
              '''        },onFailure={message->runOnUiThread {starting=false;connection.stop(false);remote=null;notice(message)}})\n''',
              '''        },onFailure={message->runOnUiThread {\n            starting=false;connection.stop(false);remote=null;state.end();home.visibility=View.VISIBLE;notice(message)\n        }})\n''')

          replace_once(activity,
              '''    private fun inviteDialog() {\n        if(invite.isBlank()||!state.active)return\n        val column=LinearLayout(this).apply {orientation=LinearLayout.VERTICAL;setPadding(d(22),d(12),d(22),d(8))}\n        val qr=MultiFormatWriter().encode(invite,BarcodeFormat.QR_CODE,360,360)\n        val bitmap=Bitmap.createBitmap(360,360,Bitmap.Config.ARGB_8888)\n        val pixels=IntArray(360*360){i->if(qr[i%360,i/360])Color.BLACK else Color.WHITE}\n        bitmap.setPixels(pixels,0,360,0,0,360,360)\n        column.addView(ImageView(this).apply {setImageBitmap(bitmap)},LinearLayout.LayoutParams(d(190),d(190)).apply {gravity=Gravity.CENTER_HORIZONTAL})\n''',
              '''    private fun inviteDialog() {\n        if(invite.isBlank()||!state.active)return\n        if(destroyed||isFinishing||!foreground){pendingInviteDialog=true;return}\n        pendingInviteDialog=false\n        val column=LinearLayout(this).apply {orientation=LinearLayout.VERTICAL;setPadding(d(22),d(12),d(22),d(8))}\n        // A QR rendering failure must never terminate the call UI; Share/Copy still work.\n        runCatching {\n            val qr=MultiFormatWriter().encode(invite,BarcodeFormat.QR_CODE,360,360)\n            val bitmap=Bitmap.createBitmap(360,360,Bitmap.Config.ARGB_8888)\n            val pixels=IntArray(360*360){i->if(qr[i%360,i/360])Color.BLACK else Color.WHITE}\n            bitmap.setPixels(pixels,0,360,0,0,360,360)\n            column.addView(ImageView(this).apply {setImageBitmap(bitmap)},LinearLayout.LayoutParams(d(190),d(190)).apply {gravity=Gravity.CENTER_HORIZONTAL})\n        }\n''')

          replace_once(activity,
              '''    override fun onResume(){super.onResume();foreground=true;resumeAr()\n        if(resumeSharing&&state.active){state.paused=false;voice.setMuted(micMuted)};resumeSharing=false\n        pendingApproval?.let{pendingApproval=null;requestApproval(it.first,it.second)}\n    }\n''',
              '''    override fun onResume(){super.onResume();foreground=true\n        // Do not open the camera merely by opening the app. Resume it only for an active/start-in-progress call.\n        if(state.active||starting||pendingLocal!=null)resumeAr()\n        if(resumeSharing&&state.active){state.paused=false;voice.setMuted(micMuted)};resumeSharing=false\n        pendingApproval?.let{pendingApproval=null;requestApproval(it.first,it.second)}\n        if(pendingInviteDialog&&state.active&&invite.isNotBlank())handler.post {\n            if(foreground&&!destroyed&&!isFinishing)inviteDialog()\n        }\n    }\n''')

          replace_once(renderer,
              '''    private fun publishVideo(frame: Frame, camera: Camera, strokes: List<StrokeSnapshot>): VideoDepthFrame? {\n        if (!state.active || state.paused) return null\n        try {\n            val dims = camera.imageIntrinsics.imageDimensions\n            val pipe = videoPipe ?: RtcVideoPipe(call, dims[0], dims[1], imageRotation).also { videoPipe = it }\n            if (!state.hasHelper() || !pipe.isDue(frame.timestamp, System.nanoTime())) return null\n''',
              '''    private fun publishVideo(frame: Frame, camera: Camera, strokes: List<StrokeSnapshot>): VideoDepthFrame? {\n        // Keep the local AR preview completely independent of WebRTC. In particular, do not create\n        // a second shared EGL surface until an approved helper actually needs encoded video.\n        if (!state.active || state.paused || !state.hasHelper()) return null\n        try {\n            val dims = camera.imageIntrinsics.imageDimensions\n            val pipe = videoPipe ?: RtcVideoPipe(call, dims[0], dims[1], imageRotation).also { videoPipe = it }\n            if (!pipe.isDue(frame.timestamp, System.nanoTime())) return null\n''')

          # Source-level regression guards for the lifecycle ordering that cannot be exercised on hosted CI ARCore.
          a = Path(activity).read_text()
          r = Path(renderer).read_text()
          assert a.index('home.visibility=View.GONE') < a.index('connection.start(BuildConfig.SHOWME_SERVICE_ORIGIN')
          segment = r[r.index('private fun publishVideo'):r.index('private fun captureIfDue')]
          assert segment.index('!state.hasHelper()') < segment.index('RtcVideoPipe(')
          assert 'if(destroyed||isFinishing||!foreground){pendingInviteDialog=true;return}' in a
          PY
          git diff --check
          git diff -- android/showme/src/main/java/com/sirpaul/showme/ShowMeActivity.kt android/showme/src/main/java/com/sirpaul/showme/ShowMeRenderer.kt
      - name: Commit atomic hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/showme-runtime-hotfix.yml
          git add android/showme/src/main/java/com/sirpaul/showme/ShowMeActivity.kt android/showme/src/main/java/com/sirpaul/showme/ShowMeRenderer.kt
          git commit -m "fix(showme): harden call startup and defer WebRTC video pipeline"
          git push origin HEAD:showme/remote-assistance
