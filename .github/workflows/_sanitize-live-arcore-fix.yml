name: Sanitize live AR lifecycle patch

on:
  push:
    branches: [live-bird-arcore-fix]
    paths:
      - 'scripts/_sanitize_live_arcore_fix.py'
      - '.github/workflows/_sanitize-live-arcore-fix.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: live-bird-arcore-fix
      - name: Sanitize source
        run: |
          python3 scripts/_sanitize_live_arcore_fix.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt').read_text()
          assert 'arErrorText.text = "AR session could not start\\n\\n$category"' in text
          PY
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(android): sanitize AR failure UI source'
          git push origin HEAD:live-bird-arcore-fix
