name: spatial-sync-v3-ci

on:
  push:
    branches:
      - fresh/no-map-runtime-poc
  pull_request:

permissions:
  contents: write

concurrency:
  group: spatial-sync-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: chmod +x android/gradlew

      - name: Unit tests + lint + debug + release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease 2>&1 | tee ../android-build.log

      - name: Verify stable APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED="9e752e4f1ae0d9f1dd72b17a3d72d88e82e54075651dc268657877a0e73eaf3a"
          : > apk-signature.txt
          for APK in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            echo "=== $APK ===" | tee -a apk-signature.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a apk-signature.txt
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "Signer #1 certificate SHA-256 digest:" | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            test "$ACTUAL" = "$EXPECTED"
            echo "Stable signing certificate verified: $ACTUAL" | tee -a apk-signature.txt
          done

      - name: Upload compiler and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/lint-results-release.*
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            android/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signature report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-signature-report
          path: apk-signature.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-sync-v3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-sync-v3-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest signed APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/fresh/no-map-runtime-poc'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk SpatialSync-latest-dev.apk
          cp android/app/build/outputs/apk/release/app-release.apk SpatialSync-latest-release.apk
          sha256sum SpatialSync-latest-dev.apk SpatialSync-latest-release.apk > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          Automated signed builds from \`fresh/no-map-runtime-poc\` at \`$GITHUB_SHA\`.

          - Unit tests: passed
          - Android debug/release lint: passed
          - Debug APK: signed and verified
          - Release APK: signed, non-debuggable, verified
          - Stable sideload certificate SHA-256: \`9E:75:2E:4F:1A:E0:D9:F1:DD:72:B1:7A:3D:72:D8:8E:82:E5:40:75:65:1D:C2:68:65:78:77:A0:E7:3E:AF:3A\`
          - Both variants share the same application ID/signing identity so installs can update in place when Android version-code rules permit it.

          Use \`SpatialSync-latest-release.apk\` for normal device testing. Use the dev APK only when a debuggable build is specifically needed.
          EOF
          gh release delete latest-dev --cleanup-tag -y || true
          gh release create latest-dev SpatialSync-latest-release.apk SpatialSync-latest-dev.apk SHA256SUMS.txt apk-signature.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Spatial Sync — latest signed build" \
            --notes-file RELEASE_NOTES.md
