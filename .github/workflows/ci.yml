name: spatial-sync-v3-ci

on:
  push:
    branches:
      - fresh/no-map-runtime-poc
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: chmod +x android/gradlew

      - name: Unit tests + lint + Android APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ../android-build.log

      - name: Upload compiler and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-sync-v3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest-dev APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/fresh/no-map-runtime-poc'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpatialSync-latest-dev.apk
          sha256sum SpatialSync-latest-dev.apk > SHA256SUMS.txt
          gh release delete latest-dev --cleanup-tag -y || true
          gh release create latest-dev SpatialSync-latest-dev.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Spatial Sync latest dev" \
            --notes "Automated debug build from fresh/no-map-runtime-poc at $GITHUB_SHA. Unit tests, Android lint and assembleDebug passed."
