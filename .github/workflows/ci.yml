# Public-source release gate. No bootstrap or source-generation step is permitted here.
name: CI

on:
  push:
    paths:
      - 'android/**'
      - 'server/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'server/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests + container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Server tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build server container
        working-directory: .
        run: docker build -t spatial-ar-coop-server:ci ./server

  android:
    name: Android tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug APK
        working-directory: android
        env:
          ARCORE_API_KEY: UNCONFIGURED
          DEFAULT_SERVER_URL: http://10.0.2.2:8080
          DEFAULT_API_TOKEN: ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spatial-ar-coop-debug-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**
