# Public-source release gate. No bootstrap or source-generation step is permitted here.
name: CI

on:
  push:
    paths:
      - 'android/**'
      - 'sdk/**'
      - 'server/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'sdk/**'
      - 'server/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests + container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Server tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build server container
        working-directory: .
        run: docker build -t spatial-ar-coop-server:ci ./server

  android:
    name: Android + StableAR integration + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
      - name: Install Android/StableAR native toolchain
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
      - name: StableAR benchmark scorer contract
        run: python3 -m unittest discover -s sdk/benchmark -p 'test_*.py'
      - name: Unit tests and debug APK
        working-directory: android
        env:
          ARCORE_API_KEY: UNCONFIGURED
          DEFAULT_SERVER_URL: http://10.0.2.2:8080
          DEFAULT_API_TOKEN: ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Inspect integrated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | tee integrated-apk.txt
          grep -q 'models/xfeat.tflite' integrated-apk.txt
          grep -q 'libstablear_vision_jni.so' integrated-apk.txt
          sha256sum "$APK" | tee SPATIAL-STABLEAR-SHA256SUMS.txt
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spatial-stablear-debug-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**
            integrated-apk.txt
            SPATIAL-STABLEAR-SHA256SUMS.txt
