name: spatial-sync-v3-ci

on:
  push:
    branches:
      - fresh/no-map-runtime-poc
  pull_request:

permissions:
  contents: write

concurrency:
  group: spatial-sync-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: chmod +x android/gradlew

      - name: Unit tests + lint + signed Android APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ../android-build.log

      - name: Verify stable APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED="9e752e4f1ae0d9f1dd72b17a3d72d88e82e54075651dc268657877a0e73eaf3a"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          ACTUAL=$(grep -i "Signer #1 certificate SHA-256 digest:" apk-signature.txt | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$EXPECTED"
          echo "Stable signing certificate verified: $ACTUAL"

      - name: Upload compiler and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signature report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-signature-report
          path: apk-signature.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-sync-v3-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/fresh/no-map-runtime-poc'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk SpatialSync-latest-dev.apk
          sha256sum SpatialSync-latest-dev.apk > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          Automated signed development build from \`fresh/no-map-runtime-poc\` at \`$GITHUB_SHA\`.

          - Unit tests: passed
          - Android lint: passed
          - APK signature verification: passed
          - Stable development certificate SHA-256: \`9E:75:2E:4F:1A:E0:D9:F1:DD:72:B1:7A:3D:72:D8:8E:82:E5:40:75:65:1D:C2:68:65:78:77:A0:E7:3E:AF:3A\`
          - Version code is generated monotonically from the GitHub Actions run number, so browser-installed updates work normally.

          Migration note: builds published before stable signing was introduced used an ephemeral CI debug key. If Android says the app cannot be installed while updating one of those older builds, uninstall Spatial Sync once and install this build. Future latest-dev builds will update in place.
          EOF
          gh release delete latest-dev --cleanup-tag -y || true
          gh release create latest-dev SpatialSync-latest-dev.apk SHA256SUMS.txt apk-signature.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Spatial Sync — latest signed dev" \
            --notes-file RELEASE_NOTES.md
