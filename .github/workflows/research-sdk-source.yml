name: research-sdk-source
on:
  push:
    branches: [research_sdk]
    paths: ['.github/workflows/research-sdk-source.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/research_sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export existing Git objects without running branch code
        run: git bundle create /tmp/research-all-branches.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: research-all-branches
          path: /tmp/research-all-branches.bundle
          retention-days: 1
