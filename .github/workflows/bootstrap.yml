name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Salvage complete files from the damaged source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part{00..06} > /tmp/spatial-source.b64
          base64 --decode /tmp/spatial-source.b64 > /tmp/spatial-source.tar.xz

          # The tail of the uploaded xz stream is damaged, but xz still emits a valid
          # tar stream containing every complete entry before the damaged block.
          set +e
          xz --decompress --stdout /tmp/spatial-source.tar.xz > /tmp/spatial-source.tar
          xz_rc=$?
          set -e
          echo "xz recovery exit=$xz_rc, recovered_bytes=$(wc -c < /tmp/spatial-source.tar)"
          file /tmp/spatial-source.tar

          mkdir -p /tmp/spatial-source
          set +e
          tar --ignore-zeros -xf /tmp/spatial-source.tar -C /tmp/spatial-source
          tar_rc=$?
          set -e
          echo "tar recovery exit=$tar_rc"

          test -f /tmp/spatial-source/README.md
          test -f /tmp/spatial-source/android/app/build.gradle.kts
          test -f /tmp/spatial-source/android/app/src/main/java/com/sirpaul/spatialarcoop/MainActivity.kt
          test -f /tmp/spatial-source/android/app/src/main/java/com/sirpaul/spatialarcoop/vision/ObjectDetectorEngine.kt

          mkdir -p /tmp/spatial-source/.github/workflows
          cp .github/workflows/recover-bootstrap.yml /tmp/spatial-source/.github/workflows/recover-bootstrap.yml
          cp .github/workflows/diagnose-archive.yml /tmp/spatial-source/.github/workflows/diagnose-archive.yml
          cat > /tmp/spatial-source/RECOVERY_NOTES.md <<'EOF'
          # Source recovery note

          The original transfer archive was truncated after the Android application sources.
          Complete files were recovered losslessly. Build configuration, remaining Android
          resources, server code and documentation are regenerated in subsequent commits and
          validated by GitHub Actions.
          EOF

      - name: Publish recovered source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/spatial-source/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish recovered cooperative AR application sources'
          git push origin HEAD:main
