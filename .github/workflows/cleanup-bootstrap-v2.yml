name: One-shot bootstrap cleanup v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-cleanup-v2
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove transport-only bootstrap files after source publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f server/package.json || ! -f android/settings.gradle.kts ]]; then
            echo 'Normal source tree is not published yet; leaving recovery files intact.'
            exit 0
          fi
          rm -rf .bootstrap
          rm -f RECOVERY_NOTES.md
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-v2.yml
          rm -f .github/workflows/recover-bootstrap.yml
          rm -f .github/workflows/diagnose-archive.yml
          rm -f .github/workflows/cleanup-bootstrap.yml
          rm -f .github/workflows/cleanup-bootstrap-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove bootstrap transport files'
            git push origin HEAD:main
          fi
