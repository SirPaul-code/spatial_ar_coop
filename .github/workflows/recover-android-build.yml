name: Recover Android build infrastructure

on:
  push:
    branches: [stabilization-chatgpt]
    paths:
      - '.github/workflows/recover-android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-chatgpt
          fetch-depth: 0

      - name: Decode validated v2 source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'v2.part*' | sort -V)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 --decode > /tmp/spatial-v2.tar.xz
          xz --test /tmp/spatial-v2.tar.xz
          rm -rf /tmp/spatial-v2 && mkdir -p /tmp/spatial-v2
          tar -xJf /tmp/spatial-v2.tar.xz -C /tmp/spatial-v2
          source_root=/tmp/spatial-v2
          mapfile -t top < <(find /tmp/spatial-v2 -mindepth 1 -maxdepth 1 -print)
          if (( ${#top[@]} == 1 )) && [[ -d "${top[0]}" ]]; then source_root="${top[0]}"; fi
          test -f "$source_root/android/settings.gradle.kts"
          echo "$source_root" > /tmp/source-root

      - name: Restore only missing build files
        shell: bash
        run: |
          set -euo pipefail
          source_root=$(cat /tmp/source-root)
          for f in settings.gradle.kts build.gradle.kts gradle.properties; do
            test -f "$source_root/android/$f"
            if [[ ! -f "android/$f" ]]; then cp "$source_root/android/$f" "android/$f"; fi
          done
          if [[ ! -f android/gradlew ]]; then cp "$source_root/android/gradlew" android/gradlew; chmod +x android/gradlew; fi
          if [[ ! -d android/gradle/wrapper ]]; then mkdir -p android/gradle; cp -a "$source_root/android/gradle/wrapper" android/gradle/; fi
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts

      - name: Commit restored build infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/settings.gradle.kts android/build.gradle.kts android/gradle.properties android/gradlew android/gradle/wrapper 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore Android Gradle project infrastructure'
            git pull --rebase origin stabilization-chatgpt
            git push origin HEAD:stabilization-chatgpt
          fi
