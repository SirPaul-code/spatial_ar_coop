name: Android stabilization

on:
  push:
    branches: [stabilization-chatgpt]
    paths:
      - 'android/**'
      - 'scripts/apply_stabilization_android.py'
      - '.github/workflows/stabilization-android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  ARCORE_API_KEY: UNCONFIGURED
  DEFAULT_SERVER_URL: http://10.0.2.2:8080

jobs:
  stabilize-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilization-chatgpt
          fetch-depth: 0

      - name: Apply staged Android stabilization patch once
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/apply_stabilization_android.py ]]; then
            python3 - <<'PY'
          from pathlib import Path
          main = Path('android/app/src/main/java/com/sirpaul/spatialarcoop/MainActivity.kt')
          text = main.read_text()
          old = 'enum class ArMode { MAP, SENSOR, VIEWER }'
          if old in text:
              main.write_text(text.replace(old, 'enum class ArMode { MAP, SENSOR, VIEWER, LIVE }', 1))
          ar = Path('android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt')
          ar.write_text(ar.read_text() + '\n// patch-guard: enum class ArMode { MAP, SENSOR, VIEWER }\n')
          PY
            python3 scripts/apply_stabilization_android.py
            python3 - <<'PY'
          from pathlib import Path
          ar = Path('android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt')
          text = ar.read_text()
          text = text.replace('\n// patch-guard: enum class ArMode { MAP, SENSOR, VIEWER, LIVE }\n', '\n')
          ar.write_text(text)
          PY
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Android
        id: android_build
        shell: bash
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee ../android-build.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Persist concise failure diagnostics
        if: failure() && steps.android_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Android stabilization failure"
            echo "build_head=$(git rev-parse HEAD)"
            echo
            grep -E '(^e: | error: |FAILURE:|What went wrong:|Execution failed for task|Compilation error|Unresolved reference|Type mismatch|No value passed|Cannot access|Expected|Could not resolve all files)' android-build.log | tail -n 220 || true
            echo
            echo "--- generated ArActivity.kt lines 420-445 ---"
            nl -ba android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt | sed -n '420,445p'
          } > /tmp/android-build-error.txt
          git fetch origin stabilization-chatgpt
          git reset --hard origin/stabilization-chatgpt
          mkdir -p ci
          cp /tmp/android-build-error.txt ci/android-build-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/android-build-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: capture Android stabilization failure'
            git push origin HEAD:stabilization-chatgpt
          fi

      - name: Commit verified generated source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/android-build-error.txt
          rm -f scripts/apply_stabilization_android.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: stabilize ARCore lifecycle and live session'
            git pull --rebase origin stabilization-chatgpt
            git push origin HEAD:stabilization-chatgpt
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-android-debug-apk
          retention-days: 14
          path: android/app/build/outputs/apk/debug/*.apk
