name: Self-recovering bootstrap build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  ARCORE_API_KEY: ci-placeholder-not-valid-at-runtime
  SPATIAL_SERVER_URL: http://10.0.2.2:8080

jobs:
  recover-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source archive when bootstrap did not publish it
        shell: bash
        run: |
          set -euo pipefail
          has_server=false
          [[ -f server/package.json || -f backend/package.json ]] && has_server=true
          has_android=false
          [[ -f gradlew || -f android/gradlew || -f mobile/gradlew ]] && has_android=true
          if [[ "$has_server" == true && "$has_android" == true ]]; then
            echo "Published source tree is already present."
            exit 0
          fi

          shopt -s nullglob
          parts=(.bootstrap/source.part*)
          if (( ${#parts[@]} == 0 )); then
            echo "Source tree is incomplete and no .bootstrap/source.part* archive exists." >&2
            find . -maxdepth 4 -type f | sort | sed -n '1,320p'
            exit 1
          fi

          printf '%s\n' "${parts[@]}" | sort -V > /tmp/source-parts.txt
          while IFS= read -r part; do cat "$part"; done < /tmp/source-parts.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/spatial-source.bin
          sha256sum /tmp/spatial-source.bin | tee bootstrap-archive.sha256
          file /tmp/spatial-source.bin | tee bootstrap-archive.type

          rm -rf /tmp/spatial-unpack
          mkdir -p /tmp/spatial-unpack
          if tar -tzf /tmp/spatial-source.bin >/dev/null 2>&1; then
            tar -xzf /tmp/spatial-source.bin -C /tmp/spatial-unpack
          elif tar -tf /tmp/spatial-source.bin >/dev/null 2>&1; then
            tar -xf /tmp/spatial-source.bin -C /tmp/spatial-unpack
          elif unzip -t /tmp/spatial-source.bin >/dev/null 2>&1; then
            unzip -q /tmp/spatial-source.bin -d /tmp/spatial-unpack
          else
            echo "Decoded bootstrap payload is not a supported tar/tar.gz/zip archive." >&2
            exit 1
          fi

          mapfile -t top_entries < <(find /tmp/spatial-unpack -mindepth 1 -maxdepth 1 -print)
          source_root=/tmp/spatial-unpack
          if (( ${#top_entries[@]} == 1 )) && [[ -d "${top_entries[0]}" ]]; then
            candidate="${top_entries[0]}"
            if [[ -f "$candidate/gradlew" || -f "$candidate/android/gradlew" || -f "$candidate/server/package.json" ]]; then
              source_root="$candidate"
            fi
          fi
          rsync -a --delete-excluded \
            --exclude=.git \
            --exclude=.bootstrap \
            "$source_root/" ./

          [[ -f server/package.json || -f backend/package.json ]] || {
            echo "Recovered payload has no server package.json" >&2; exit 1;
          }
          [[ -f gradlew || -f android/gradlew || -f mobile/gradlew ]] || {
            echo "Recovered payload has no Gradle wrapper" >&2; exit 1;
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and test server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/package.json ]]; then SERVER_DIR=server; else SERVER_DIR=backend; fi
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"
          cd "$SERVER_DIR"
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/server-test.log"

      - name: Build and smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t spatial-ar-coop-server:bootstrap "$SERVER_DIR" 2>&1 | tee server-docker-build.log
          docker run -d --rm --name spatial-ar-coop-bootstrap -p 18080:8080 \
            -e PORT=8080 -e DATA_DIR=/data -e LOG_LEVEL=debug \
            spatial-ar-coop-server:bootstrap
          cleanup() {
            docker logs spatial-ar-coop-bootstrap > server-container.log 2>&1 || true
            docker stop spatial-ar-coop-bootstrap >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/healthz > server-health.json; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]]

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then GRADLE_DIR=.
          elif [[ -f android/gradlew ]]; then GRADLE_DIR=android
          else GRADLE_DIR=mobile
          fi
          chmod +x "$GRADLE_DIR/gradlew"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Android APK
        shell: bash
        run: |
          set -o pipefail
          cd "$GRADLE_DIR"
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find "$GRADLE_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -1)
          [[ -n "$apk" && -f "$apk" ]]
          cp "$apk" dist/spatial-ar-coop-debug.apk
          sha256sum dist/spatial-ar-coop-debug.apk | tee dist/SHA256SUMS
          printf 'commit=%s\nsource=%s\n' "$GITHUB_SHA" "$apk" > dist/build-metadata.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-spatial-ar-coop-debug-apk
          retention-days: 30
          path: dist/*

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-build-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            bootstrap-archive.sha256
            bootstrap-archive.type
            server-test.log
            server-docker-build.log
            server-container.log
            server-health.json
            android-build.log
            **/build/reports/tests/**

      - name: Publish fixed-name fallback prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete demo-bootstrap-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          git tag -f demo-bootstrap-latest "$GITHUB_SHA"
          git push --force origin refs/tags/demo-bootstrap-latest
          gh release create demo-bootstrap-latest \
            --prerelease \
            --title "Spatial AR Coop — bootstrap verified demo" \
            --notes "Server tests, Docker smoke test and Android debug build completed from commit $GITHUB_SHA. The API key placeholder builds successfully but must be replaced for Cloud Anchor runtime use." \
            dist/spatial-ar-coop-debug.apk dist/SHA256SUMS dist/build-metadata.txt
