name: Apply final live integration fix

on:
  push:
    branches:
      - fix/final-live-auto-localize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 scripts/final_live_fix.py
      - name: Remove one-shot patch machinery
        run: |
          git rm scripts/final_live_fix.py
          git rm .github/workflows/apply-final-live-fix.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android README.md
          git commit -m "fix: make live detection automatic and harden shared localization"
          git push origin HEAD:fix/final-live-auto-localize
