name: apply-spatial-stablear

on:
  push:
    branches: [integration/spatial-stablear]
    paths:
      - 'scripts/apply_spatial_stablear_integration.py'
      - 'scripts/patch_stablear_coordinator.py'
      - 'scripts/patch_stablear_benchmark_root.py'
      - 'scripts/patch_stablear_debug_benchmark.py'
      - '.github/workflows/apply-spatial-stablear.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-spatial-stablear-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/spatial-stablear
          fetch-depth: 0
      - name: Apply reviewable integration recipes
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'val stableCoordinator = ensureStableAr' android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt; then
            python3 scripts/apply_spatial_stablear_integration.py
          fi
          python3 scripts/patch_stablear_coordinator.py
          python3 scripts/patch_stablear_benchmark_root.py
          python3 scripts/patch_stablear_debug_benchmark.py
      - name: Commit generated product wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Integration is already applied.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt \
                  android/app/src/main/java/com/sirpaul/spatialarcoop/stablear/StableArCoordinator.kt \
                  android/app/src/main/java/com/sirpaul/spatialarcoop/stablear/StableArBenchmarkRecorder.kt
          git commit -m 'feat(android): wire StableAR into shared spatial markers and benchmark'
          git push origin HEAD:integration/spatial-stablear
