name: Apply localization and track quality fix

"on":
  push:
    branches:
      - "fix/localization-and-track-quality"
    paths:
      - ".github/workflows/apply-localization-track-quality-fix.yml"
      - "scripts/apply_localization_track_quality_fix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/localization-and-track-quality
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply_localization_track_quality_fix.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "fix(android): stabilize localization and spatial tracking"
          git push origin HEAD:fix/localization-and-track-quality
      - name: Remove one-shot patch files
        run: |
          git rm .github/workflows/apply-localization-track-quality-fix.yml scripts/apply_localization_track_quality_fix.py
          git commit -m "chore: remove one-shot localization patch files"
          git push origin HEAD:fix/localization-and-track-quality
