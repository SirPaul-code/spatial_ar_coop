name: showme-bootstrap

on:
  push:
    branches: [showme/remote-assistance]
    paths: [.github/workflows/showme-bootstrap.yml]

permissions:
  contents: write

jobs:
  materialize-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed Internet patch
        shell: bash
        run: |
          set -euo pipefail
          cat showme/.bootstrap/patch-*.b64 > /tmp/showme-patch.b64
          base64 -d /tmp/showme-patch.b64 | gzip -d > /tmp/showme.patch
          echo "7d4a470eb81761679d25398b8849d0266e269ffa7c856d2d596fa19f20b53a31  /tmp/showme.patch" | sha256sum -c -
          git apply --check /tmp/showme.patch
          git apply /tmp/showme.patch
          if compgen -G "showme/.bootstrap/fix-*.b64" > /dev/null; then
            cat showme/.bootstrap/fix-*.b64 > /tmp/showme-fix.b64
            base64 -d /tmp/showme-fix.b64 | gzip -d > /tmp/showme-fix.patch
            echo "b6c63a1c2a4e213d652a18fe1f7e7c50616ad71793a25146e4e117c42914a76a  /tmp/showme-fix.patch" | sha256sum -c -
            git apply --check /tmp/showme-fix.patch
            git apply /tmp/showme-fix.patch
          fi
          git checkout HEAD -- .github/workflows/showme-ci.yml
          rm -rf showme/.bootstrap
          rm -f .github/workflows/showme-bootstrap.yml
          git diff --check
          git diff --exit-code a5970e9be7fef9434dbf2e681274dc56c9462fe4 -- android/app .github/workflows/ci.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser geometry, frame identity and control tests
        run: node --test showme/web/*.test.mjs

      - name: Browser integration dependencies
        working-directory: showme
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Real browser WebRTC and annotation smoke test
        working-directory: showme
        run: npm run test:browser

      - name: Worker signaling, Durable Object and deploy validation
        working-directory: showme/server
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          npm run test:integration
          npm run check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Android unit tests, lint and APKs
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :showme:testDebugUnitTest :showme:lintDebug :showme:lintRelease :showme:assembleDebug :showme:assembleRelease 2>&1 | tee ../showme-build.log

      - name: Verify package and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED="9e752e4f1ae0d9f1dd72b17a3d72d88e82e54075651dc268657877a0e73eaf3a"
          : > showme-signatures.txt
          for APK in android/showme/build/outputs/apk/debug/showme-debug.apk android/showme/build/outputs/apk/release/showme-release.apk; do
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee -a showme-signatures.txt
            ACTUAL=$("$TOOLS/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate SHA-256 digest:" | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            test "$ACTUAL" = "$EXPECTED"
            "$TOOLS/aapt" dump badging "$APK" | grep "package: name='com.sirpaul.showme'"
          done
          if "$TOOLS/aapt" dump badging android/showme/build/outputs/apk/release/showme-release.apk | grep -q application-debuggable; then
            echo "Release APK unexpectedly debuggable" >&2
            exit 1
          fi

      - name: Commit verified Internet source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(showme): ship internet calls and field-tested media/precision fixes [stage-only]"
          git push origin HEAD:showme/remote-assistance
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload verified diagnostics and APKs
        uses: actions/upload-artifact@v4
        with:
          name: showme-internet-verified
          path: |
            showme-build.log
            showme-signatures.txt
            showme/test-results/
            android/showme/build/reports/
            android/showme/build/test-results/
            android/showme/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish ShowMe Internet release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/showme/build/outputs/apk/debug/showme-debug.apk ShowMe-latest-dev.apk
          cp android/showme/build/outputs/apk/release/showme-release.apk ShowMe-latest-release.apk
          sha256sum ShowMe-latest-dev.apk ShowMe-latest-release.apk > SHOWME-SHA256SUMS.txt
          zip -j ShowMe-browser.zip showme/web/index.html showme/web/style.css showme/web/app.js showme/web/geometry.mjs showme/web/live-video.mjs showme/web/control-rpc.mjs showme/web/remote-session.mjs
          zip -r ShowMe-server.zip showme/server showme/web -x '*/node_modules/*' '*/.wrangler/*' '*/.dry-run/*' '*/public/*' '*/test-results/*'
          cat > SHOWME-RELEASE.md <<EOF
          ShowMe Internet build from \`showme/remote-assistance\` at \`$FINAL_SHA\`.

          Install \`ShowMe-latest-release.apk\` on the camera owner's Android phone. Activate it once against your deployed ShowMe Worker, then use Start a call -> Invite -> Allow. The helper opens the HTTPS invitation in a browser on any network; no helper app is required.

          - Real WebRTC video/audio/data with direct ICE and TURN relay fallback.
          - Frame-exact AR placement preserves the decoded video-frame identity and its historical pose/intrinsics/depth.
          - Whole-stroke texture/depth verification for pins, arrows, circles and freehand guidance.
          - Periodic metric/texture work moved away from the GL render path; timing diagnostics included for physical stutter analysis.
          - Worker/Durable Object signaling tests, browser WebRTC smoke tests, Android tests/lint/build and APK signature checks passed in this release job.
          - Existing Spatial Sync runtime is unchanged.
          - Physical phone/browser FPS and centimetre placement accuracy still require real-device measurement; CI does not manufacture those claims.
          - Uses the repository trial signing identity, not a private Play production key.
          EOF
          gh release delete showme-latest --cleanup-tag -y || true
          gh release create showme-latest ShowMe-latest-release.apk ShowMe-latest-dev.apk ShowMe-browser.zip ShowMe-server.zip SHOWME-SHA256SUMS.txt showme-signatures.txt \
            --target "$FINAL_SHA" --prerelease --latest=false --title "ShowMe - Internet WebRTC camera assistance" --notes-file SHOWME-RELEASE.md
