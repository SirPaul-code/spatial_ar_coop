name: Finalize continuous live track publish

on:
  push:
    branches: [live-bird-arcore-fix]
    paths:
      - 'scripts/_finalize_live_track_publish.py'
      - '.github/workflows/_finalize-live-track-publish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: live-bird-arcore-fix
      - name: Apply source patch
        run: |
          python3 scripts/_finalize_live_track_publish.py
          git diff --check
          grep -q 'TRACK_PUBLISH_INTERVAL_MS' android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
          grep -q 'localTracker.clear()' android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat(android): continuously publish active Live tracks'
          git push origin HEAD:live-bird-arcore-fix
