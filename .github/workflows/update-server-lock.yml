name: Update server lockfile

on:
  push:
    branches: [ux-auth-qr-flow]
    paths: ['.github/workflows/update-server-lock.yml']

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux-auth-qr-flow
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate package lock
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build(server): lock QR code dependency tree'
          git push origin HEAD:ux-auth-qr-flow
