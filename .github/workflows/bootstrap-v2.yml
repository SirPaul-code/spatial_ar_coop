name: Recover, verify and build source v2

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/final.part*'
      - '.github/workflows/bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-source-v2
  cancel-in-progress: true

jobs:
  publish-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: recover
        name: Recover verified source tree
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f server/package.json && -f android/settings.gradle.kts ]]; then
            echo 'The normal source tree already exists.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parts=(
            .bootstrap/final.part00
            .bootstrap/final.part01
            .bootstrap/final.part02
            .bootstrap/final.part03
            .bootstrap/final.part04
            .bootstrap/final.part05
            .bootstrap/final.part06a
            .bootstrap/final.part06b
            .bootstrap/final.part06c
            .bootstrap/final.part06d
            .bootstrap/final.part07
            .bootstrap/final.part08
            .bootstrap/final.part09
            .bootstrap/final.part10
          )

          for part in "${parts[@]}"; do
            test -f "$part" || { echo "Missing archive part: $part"; exit 1; }
          done

          cat "${parts[@]}" > /tmp/spatial-source.b64
          base64 --decode /tmp/spatial-source.b64 > /tmp/spatial-source.tar.gz
          echo '0e4841d5e5f0af239c05bf745688ba9ffdc864b2f54657f6028a40cdd001a364  /tmp/spatial-source.tar.gz' \
            | sha256sum --check --strict
          gzip --test /tmp/spatial-source.tar.gz

          mkdir -p /tmp/spatial-source
          tar -xzf /tmp/spatial-source.tar.gz -C /tmp/spatial-source
          test -f /tmp/spatial-source/README.md
          test -f /tmp/spatial-source/server/package.json
          test -f /tmp/spatial-source/android/settings.gradle.kts
          test -f /tmp/spatial-source/android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/spatial-source/ ./
          chmod +x android/gradlew scripts/*.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish cooperative spatial AR demo'
            git push origin HEAD:main
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.recover.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.recover.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        if: steps.recover.outputs.ready == 'true'

      - name: Install Android SDK packages
        if: steps.recover.outputs.ready == 'true'
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.recover.outputs.ready == 'true'
        with:
          gradle-version: '8.13'

      - name: Test relay and map server
        if: steps.recover.outputs.ready == 'true'
        working-directory: server
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check

      - name: Build server container
        if: steps.recover.outputs.ready == 'true'
        run: docker build --tag spatial-ar-coop-server:ci server

      - name: Test and assemble Android debug APK
        if: steps.recover.outputs.ready == 'true'
        working-directory: android
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY || 'UNCONFIGURED' }}
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL || 'http://192.168.1.10:8080' }}
          DEFAULT_API_TOKEN: ${{ secrets.DEFAULT_API_TOKEN || '' }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload APK and reports
        if: always() && steps.recover.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ar-coop-debug-apk
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**
