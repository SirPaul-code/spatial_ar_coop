name: showme-source-bundle
on:
  push:
    branches: [showme/remote-assistance]
    paths: [.github/workflows/showme-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source only
        run: git archive --format=tar HEAD > showme-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: showme-source-bundle
          path: showme-source.tar
          retention-days: 3
