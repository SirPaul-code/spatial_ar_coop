name: stablear-source-export
on:
  push:
    branches: [stablear/multiplatform-sdk]
    paths: ['.github/workflows/stablear-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: stablear-source-export-${{ github.sha }}
          path: |
            android/app/src/main/java/com/sirpaul/spatialnomap/ArRenderer.kt
            android/app/src/main/java/com/sirpaul/spatialnomap/MainActivity.kt
            android/app/build.gradle.kts
            android/build.gradle.kts
            .github/workflows/stablear-multiplatform.yml
            sdk/STATUS.md
          if-no-files-found: error
          retention-days: 1
