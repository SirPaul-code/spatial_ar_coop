name: Reproducible server and Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/ci-status/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"

jobs:
  server:
    name: Server tests and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve server directory
        id: server-dir
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/package.json ]]; then
            dir=server
          elif [[ -f backend/package.json ]]; then
            dir=backend
          else
            echo "No server/package.json or backend/package.json found" >&2
            find . -maxdepth 3 -type f | sort | sed -n '1,240p'
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "SERVER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SERVER_DIR"
          if [[ -f package-lock.json ]]; then
            npm ci 2>&1 | tee ../server-install.log
          else
            echo "::warning::package-lock.json is missing; using npm install"
            npm install 2>&1 | tee ../server-install.log
          fi

      - name: Run server tests
        shell: bash
        run: |
          set -o pipefail
          cd "$SERVER_DIR"
          npm test 2>&1 | tee ../server-test.log

      - name: Build server container
        shell: bash
        run: |
          set -o pipefail
          docker build -t spatial-ar-coop-server:ci "$SERVER_DIR" 2>&1 | tee server-docker-build.log

      - name: Smoke-test server container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-server-data
          docker run -d --rm \
            --name spatial-ar-coop-ci \
            -p 18080:8080 \
            -e PORT=8080 \
            -e DATA_DIR=/data \
            -e LOG_LEVEL=debug \
            -v "$PWD/.ci-server-data:/data" \
            spatial-ar-coop-server:ci
          cleanup() {
            docker logs spatial-ar-coop-ci > server-container.log 2>&1 || true
            docker stop spatial-ar-coop-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz > server-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz || \
            curl --fail --silent --show-error http://127.0.0.1:18080/healthz

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ci-logs
          if-no-files-found: warn
          retention-days: 30
          path: |
            server-install.log
            server-test.log
            server-docker-build.log
            server-container.log
            server-health.json

  android:
    name: Android test and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Gradle project
        id: gradle-project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then
            dir=.
          elif [[ -f android/gradlew ]]; then
            dir=android
          elif [[ -f mobile/gradlew ]]; then
            dir=mobile
          else
            echo "No Gradle wrapper found at ./gradlew, android/gradlew, or mobile/gradlew" >&2
            find . -maxdepth 4 -type f | sort | sed -n '1,260p'
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "GRADLE_PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          chmod +x "$dir/gradlew"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build and test Android app
        env:
          ARCORE_API_KEY: ci-placeholder-not-valid-at-runtime
          SPATIAL_SERVER_URL: http://10.0.2.2:8080
        shell: bash
        run: |
          set -o pipefail
          cd "$GRADLE_PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace --warning-mode all \
            clean testDebugUnitTest assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Collect APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find "$GRADLE_PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No debug APK produced" >&2
            find "$GRADLE_PROJECT_DIR" -type f -path '*/build/outputs/*' | sort || true
            exit 1
          fi
          cp "${apks[0]}" dist/spatial-ar-coop-debug.apk
          sha256sum dist/spatial-ar-coop-debug.apk | tee dist/SHA256SUMS
          {
            echo "commit=$GITHUB_SHA"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "apk_source=${apks[0]}"
          } > dist/build-metadata.txt

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-logs
          if-no-files-found: warn
          retention-days: 30
          path: |
            android-build.log
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/problems/**

      - name: Upload sideloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ar-coop-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: dist/*

  publish-demo:
    name: Publish rolling demo prerelease
    needs: [server, android]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: spatial-ar-coop-debug-apk
          path: dist

      - name: Publish demo-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete demo-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          git tag -f demo-latest "$GITHUB_SHA"
          git push --force origin refs/tags/demo-latest
          gh release create demo-latest \
            --prerelease \
            --title "Spatial AR Coop — latest demo build" \
            --notes "Automated debug build from commit $GITHUB_SHA. Configure a valid ARCore API key and server URL for Cloud Anchor runtime features. SHA-256 is included alongside the APK." \
            dist/spatial-ar-coop-debug.apk \
            dist/SHA256SUMS \
            dist/build-metadata.txt

  summary:
    name: Build summary
    needs: [server, android, publish-demo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "# Spatial AR Coop build"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Server tests/container | ${{ needs.server.result }} |"
            echo "| Android tests/APK | ${{ needs.android.result }} |"
            echo "| demo-latest prerelease | ${{ needs.publish-demo.result }} |"
            echo
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
