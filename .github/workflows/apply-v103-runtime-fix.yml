name: Apply v1.0.3 runtime fix

on:
  push:
    paths:
      - '.github/workflows/apply-v103-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-v103-localization-tracker
          fetch-depth: 0
      - name: Apply deterministic source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected source block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Cloud Anchor resolving: never cancel a healthy pending ARCore resolve after an
          # arbitrary 12 seconds. ARCore owns the async operation lifetime; cancel only on explicit
          # re-localize/teardown. Multiple hosted anchors are still attempted concurrently.
          cloud = 'android/app/src/main/java/com/sirpaul/spatialarcoop/ar/CloudAnchorCoordinator.kt'
          replace(cloud,
          '''        val now = System.currentTimeMillis()
        if (resolving.get()) {
            if (now - resolveStartedAtMs <= RESOLVE_BATCH_TIMEOUT_MS) return
            logger.warn(
                "Cloud Anchor resolve batch timed out",
                mapOf("mapId" to mapId, "elapsedMs" to (now - resolveStartedAtMs), "pending" to resolveFutures.size)
            )
            cancelResolveBatch()
            onState("Saved-anchor lookup timed out · retrying automatically")
        }
        if (!resolving.compareAndSet(false, true)) return
''',
          '''        // A pending resolve is useful work: ARCore keeps comparing camera features with
        // the hosted feature map until the operation succeeds or returns a result state. Do not
        // cancel/restart it on an arbitrary app timer; that can prevent a slower second device from
        // ever accumulating enough visual evidence to localize.
        if (resolving.get()) return
        if (!resolving.compareAndSet(false, true)) return
        val now = System.currentTimeMillis()
''')
          replace(cloud,
          '''        private const val MAX_CONCURRENT_RESOLVES = 4
        private const val RESOLVE_BATCH_TIMEOUT_MS = 12_000L
''',
          '''        private const val MAX_CONCURRENT_RESOLVES = 4
''')

          # 2) Spatial estimation: the track position represents feet/wheels/contact point. If the
          # map has a ground plane, prefer the bbox bottom-center ground intersection. The previous
          # implementation could choose a perfectly valid feature point on the background *behind*
          # a person and create 15-25 m ghost tracks.
          est = 'android/app/src/main/java/com/sirpaul/spatialarcoop/ar/SpatialEstimator.kt'
          replace(est, 'import com.google.ar.core.Point\n', '')
          replace(est,
          '''        val siteFromWorld = PoseMath.rigidInverse(worldFromSite)

        val bestHit = frame.hitTest(view[0], view[1])
''',
          '''        val siteFromWorld = PoseMath.rigidInverse(worldFromSite)

        // Dynamic-object tracks are represented at the contact point. A known shared ground plane
        // is therefore more semantically correct than an arbitrary feature/depth point behind the
        // object's silhouette, and is substantially more stable frame to frame.
        val groundContact = groundY?.let { intersectGround(frame, detection.rawBottomCenter, siteFromWorld, it) }
        if (groundContact != null) {
            return EstimatedPosition(groundContact, 0.38f, "ground-ray-primary")
        }

        val bestHit = frame.hitTest(view[0], view[1])
''')
          replace(est,
          '''                    is DepthPoint -> true
                    is Plane -> trackable.trackingState == TrackingState.TRACKING && trackable.isPoseInPolygon(hit.hitPose)
                    is Point -> trackable.trackingState == TrackingState.TRACKING
                    else -> false
''',
          '''                    is DepthPoint -> true
                    is Plane -> trackable.trackingState == TrackingState.TRACKING &&
                        trackable.type == Plane.Type.HORIZONTAL_UPWARD_FACING &&
                        trackable.isPoseInPolygon(hit.hitPose)
                    else -> false
''')
          replace(est,
          '''            // Moving targets often create a depth hit on the target itself. Ground projection is
            // more stable for feet/wheels when both estimates agree reasonably well.
            val ground = groundY?.let { intersectGround(frame, detection.rawBottomCenter, siteFromWorld, it) }
            if (ground != null && PoseMath.distance(site, ground) < 1.2f) {
                return EstimatedPosition(
                    sitePosition = floatArrayOf(site[0] * 0.45f + ground[0] * 0.55f, groundY, site[2] * 0.45f + ground[2] * 0.55f),
                    uncertaintyMeters = uncertainty,
                    method = "$method+ground"
                )
            }
            return EstimatedPosition(site, uncertainty, method)
        }

        val fallback = groundY?.let { intersectGround(frame, detection.rawBottomCenter, siteFromWorld, it) }
        if (fallback != null) return EstimatedPosition(fallback, 0.65f, "ground-ray")

''',
          '''            return EstimatedPosition(site, uncertainty, method)
        }

''')
          replace(est,
          '''        val physicalHeightMeters = when (detection.label.lowercase()) {
            "person" -> 1.70f
            "car" -> 1.50f
            "bird" -> 0.40f
            "dog" -> 0.65f
            "cat" -> 0.38f
            else -> 0.60f
        }
        val pixelExtent = maxOf(detection.rawBoundingBox.width(), detection.rawBoundingBox.height())
        if (!pixelExtent.isFinite() || pixelExtent < 6f) return null
''',
          '''        val (physicalExtentMeters, pixelExtent) = when (detection.label.lowercase()) {
            "person" -> 1.70f to detection.rawBoundingBox.height()
            "car" -> 1.82f to detection.rawBoundingBox.width()
            "bird" -> 0.42f to maxOf(detection.rawBoundingBox.width(), detection.rawBoundingBox.height())
            "dog" -> 0.75f to maxOf(detection.rawBoundingBox.width(), detection.rawBoundingBox.height())
            "cat" -> 0.45f to maxOf(detection.rawBoundingBox.width(), detection.rawBoundingBox.height())
            else -> 0.60f to maxOf(detection.rawBoundingBox.width(), detection.rawBoundingBox.height())
        }
        if (!pixelExtent.isFinite() || pixelExtent < 6f) return null
''')
          replace(est,
          '''        val opticalDepth = (focalPixels * physicalHeightMeters / pixelExtent).coerceIn(0.45f, 55f)
''',
          '''        val opticalDepth = (focalPixels * physicalExtentMeters / pixelExtent).coerceIn(0.45f, 55f)
''')
          replace(est,
          '''        val centerX = detection.rawBoundingBox.centerX()
        val centerY = detection.rawBoundingBox.centerY()
''',
          '''        val centerX = detection.rawBottomCenter[0]
        val centerY = detection.rawBottomCenter[1]
''')
          replace(est,
          '''        is DepthPoint -> 0
        is Plane -> 1
        is Point -> 2
        else -> 3
''',
          '''        is DepthPoint -> 0
        is Plane -> 1
        else -> 2
''')

          # 3) Live presentation and diagnostics: a source phone should show its precise raw bbox,
          # not a second copy of its own shared spatial box. Remote participant tracks and markers
          # remain spatial. Also expose room traffic while localization is still pending.
          ar = 'android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt'
          replace(ar,
          '''    @Volatile private var reporting = false
    @Volatile private var latestDetectionCount = 0
    private var realtime: RealtimeClient? = null
''',
          '''    @Volatile private var reporting = false
    @Volatile private var latestDetectionCount = 0
    @Volatile private var latestRemoteTrackCount = 0
    @Volatile private var localizationDetail: String? = null
    private var realtime: RealtimeClient? = null
''')
          replace(ar,
          '''                scheduleUpload = { UploadScheduler.enqueue(this) },
                onState = ::showDetail
''',
          '''                scheduleUpload = { UploadScheduler.enqueue(this) },
                onState = { message ->
                    localizationDetail = message
                    showDetail(message)
                }
''')
          replace(ar,
          '''        val projected = remoteTracks.snapshot(now).mapNotNull { track ->
''',
          '''        val selfId = spatialApp.preferences.deviceId
        val projected = remoteTracks.snapshot(now)
            .asSequence()
            .filter { track -> track.sourceId != selfId }
            .mapNotNull { track ->
''')
          replace(ar,
          '''            )
        }
        overlay.updateTracks(projected)
''',
          '''            )
        }.toList()
        overlay.updateTracks(projected)
''')
          replace(ar,
          '''                    ArMode.LIVE -> if (worldFromSite == null) {
                        "Detector active · $latestDetectionCount visible object(s) · resolving shared location"
                    } else {
                        "$latestDetectionCount detected · $latestLocalTrackCount spatial track(s) · sharing automatically"
                    }
''',
          '''                    ArMode.LIVE -> if (worldFromSite == null) {
                        val anchorState = localizationDetail ?: "Resolving saved Cloud Anchors"
                        "Detector $latestDetectionCount · room $latestRemoteTrackCount remote track(s) · $anchorState"
                    } else {
                        "$latestDetectionCount detected · $latestLocalTrackCount spatial track(s) · $latestRemoteTrackCount remote · sharing automatically"
                    }
''')
          replace(ar,
          '''    override fun onTracks(tracks: List<SpatialTrack>, replaceSnapshot: Boolean) {
        if (replaceSnapshot) remoteTracks.replaceAll(tracks) else remoteTracks.update(tracks)
    }
''',
          '''    override fun onTracks(tracks: List<SpatialTrack>, replaceSnapshot: Boolean) {
        if (replaceSnapshot) remoteTracks.replaceAll(tracks) else remoteTracks.update(tracks)
        latestRemoteTrackCount = remoteTracks.snapshot().count { it.sourceId != spatialApp.preferences.deviceId }
        if (realtimeConnected && mode == ArMode.LIVE) runOnUiThread {
            networkText.text = "Server connected · room active · $latestRemoteTrackCount remote track(s) buffered"
        }
    }
''')

          # 4) Version bump.
          gradle = 'android/app/build.gradle.kts'
          replace(gradle, '        versionCode = 2\n        versionName = "1.0.2"\n',
                          '        versionCode = 3\n        versionName = "1.0.3"\n')

          notes = Path('android/RELEASE_NOTES.md')
          old_notes = notes.read_text() if notes.exists() else ''
          prefix = '''# Android release notes\n\n## 1.0.3\n\n- Cloud Anchor resolves are no longer cancelled/restarted after an arbitrary 12-second app timeout; pending ARCore resolves are allowed to complete normally.\n- Shared object position prefers the mapped ground/contact ray, preventing background feature points behind people/cars from creating distant ghost tracks.\n- The reporting phone shows its precise local detector box without also rendering a duplicate spatial copy of its own track.\n- Live HUD exposes buffered remote-room tracks while localization is pending, separating WebSocket health from Cloud Anchor localization.\n- Monocular fallback uses class-appropriate bbox dimensions and bottom-contact ray geometry.\n\n'''
          if old_notes.startswith('# Android release notes\n\n'):
              old_notes = old_notes[len('# Android release notes\n\n'):]
          notes.write_text(prefix + old_notes)
          PY

          git config user.name "Pavol Duplinsky"
          git config user.email "79102860+SirPaul-code@users.noreply.github.com"
          git rm .github/workflows/apply-v103-runtime-fix.yml
          git add android
          git diff --cached --check
          git commit -m "fix(android): stabilize live localization and spatial tracks"
          git push origin HEAD:fix/live-v103-localization-tracker
