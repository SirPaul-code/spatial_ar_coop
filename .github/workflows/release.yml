name: Tagged demo release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug demo APK
        working-directory: android
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY || 'UNCONFIGURED' }}
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL || 'http://192.168.1.10:8080' }}
          DEFAULT_API_TOKEN: ${{ secrets.DEFAULT_API_TOKEN || '' }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ar-coop-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
