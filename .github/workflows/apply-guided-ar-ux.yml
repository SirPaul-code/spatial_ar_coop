name: Finalize guided AR UX patch

on:
  push:
    branches: [ux-auth-qr-flow]
    paths:
      - '.github/workflows/apply-guided-ar-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux-auth-qr-flow
      - name: Finalize Live participant role
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = 'ArMode.LIVE -> "sensor"'
          if old not in text:
              raise SystemExit('expected legacy Live wire role not found')
          text = text.replace(old, 'ArMode.LIVE -> "participant"', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'ArMode.LIVE -> "participant"' android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
      - name: Commit finalized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt
          git commit -m 'feat(android): identify unified live clients as participants'
          git push origin HEAD:ux-auth-qr-flow
