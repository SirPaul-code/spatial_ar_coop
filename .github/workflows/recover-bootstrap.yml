name: Recover, publish and build source

on:
  workflow_run:
    workflows: ['Bootstrap source tree']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recover-publish-build
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover source tree when bootstrap is still present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/package.json && -f android/settings.gradle.kts ]]; then
            echo 'Normal source tree already exists; preserving it.'
            exit 0
          fi

          part_count="$(find .bootstrap -maxdepth 1 -type f -name 'source.part*' | wc -l | tr -d ' ')"
          test "$part_count" = '10' || { echo "Expected 10 archive parts, found $part_count"; exit 1; }
          cat .bootstrap/source.part{00..09} > /tmp/spatial-source.b64
          base64 --decode /tmp/spatial-source.b64 > /tmp/spatial-source.tar.xz
          echo "Archive SHA-256: $(sha256sum /tmp/spatial-source.tar.xz | cut -d' ' -f1)"
          xz --test /tmp/spatial-source.tar.xz
          mkdir -p /tmp/spatial-source
          tar -xJf /tmp/spatial-source.tar.xz -C /tmp/spatial-source
          test -f /tmp/spatial-source/README.md
          test -f /tmp/spatial-source/server/package.json
          test -f /tmp/spatial-source/android/settings.gradle.kts

          mkdir -p /tmp/spatial-source/.github/workflows
          cp .github/workflows/recover-bootstrap.yml /tmp/spatial-source/.github/workflows/recover-bootstrap.yml
          rsync -a --delete --exclude='.git/' /tmp/spatial-source/ ./
          test -f server/package.json
          test -f android/settings.gradle.kts
          chmod +x android/gradlew
          find scripts android -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish cooperative spatial AR demo'
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test relay and map server
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm test
          npm run check

      - name: Build server container
        shell: bash
        run: docker build --tag spatial-ar-coop-server:ci server

      - name: Test and assemble Android debug APK
        working-directory: android
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-ar-coop-debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**
