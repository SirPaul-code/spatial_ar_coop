name: Fix server identity matrix

on:
  push:
    branches: [stabilization-chatgpt]
    paths: ['.github/workflows/fix-server-identity.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-chatgpt
          fetch-depth: 0
      - run: python3 scripts/fix_server_identity.py
      - name: Commit exact fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix_server_identity.py .github/workflows/fix-server-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use valid 4x4 fallback anchor matrix'
          git pull --rebase origin stabilization-chatgpt
          git push origin HEAD:stabilization-chatgpt
