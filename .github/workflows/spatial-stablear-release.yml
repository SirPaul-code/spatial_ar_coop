name: spatial-stablear-release

on:
  push:
    branches: [stablear/multiplatform-sdk]
    paths:
      - '.github/workflows/spatial-stablear-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-stablear-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v3

      - name: Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Build and verify full StableAR Spatial Sync APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee spatial-sync-apk.txt
          grep -q 'assets/models/xfeat.tflite' spatial-sync-apk.txt
          cp "$APK" SpatialAR-StableAR-latest.apk
          sha256sum SpatialAR-StableAR-latest.apk | tee SPATIAL-STABLEAR-SHA256SUMS.txt

      - name: Publish Spatial Sync StableAR GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: spatial-stablear-latest
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            SpatialAR-StableAR-latest.apk \
            SPATIAL-STABLEAR-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Spatial AR + StableAR - Android latest" \
            --prerelease \
            --notes "Latest installable Spatial Sync Android build with the full StableAR material-tracking integration from stablear/multiplatform-sdk. Includes StableAR ARCore host integration, XFeat/LiteRT learned correspondence, geometry validation, bounded material correction, and LK/ORB fallback. Development sideload build; physical two-phone acceptance remains the next validation gate."
