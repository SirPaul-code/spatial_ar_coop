name: Finalize public demo and publish APK

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/final.part*'
      - '.github/workflows/finalize-demo.yml'
      - 'android/**'
      - 'server/**'
      - 'scripts/**'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-public-demo
  cancel-in-progress: true

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover the normal source tree when required
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/package.json && -f android/settings.gradle.kts ]]; then
            echo 'Normal source tree already present.'
            exit 0
          fi

          parts=(
            .bootstrap/final.part00
            .bootstrap/final.part01
            .bootstrap/final.part02
            .bootstrap/final.part03
            .bootstrap/final.part04
            .bootstrap/final.part05
            .bootstrap/final.part06a
            .bootstrap/final.part06b
            .bootstrap/final.part06c
            .bootstrap/final.part06d
            .bootstrap/final.part07
            .bootstrap/final.part08
            .bootstrap/final.part09
            .bootstrap/final.part10
          )
          for part in "${parts[@]}"; do
            test -f "$part" || { echo "Missing archive part: $part"; exit 1; }
          done

          cat "${parts[@]}" > /tmp/spatial-source.b64
          base64 --decode /tmp/spatial-source.b64 > /tmp/spatial-source.tar.gz
          echo '0e4841d5e5f0af239c05bf745688ba9ffdc864b2f54657f6028a40cdd001a364  /tmp/spatial-source.tar.gz' \
            | sha256sum --check --strict
          gzip --test /tmp/spatial-source.tar.gz

          rm -rf /tmp/spatial-source
          mkdir -p /tmp/spatial-source
          tar -xzf /tmp/spatial-source.tar.gz -C /tmp/spatial-source
          test -f /tmp/spatial-source/README.md
          test -f /tmp/spatial-source/server/package.json
          test -f /tmp/spatial-source/android/settings.gradle.kts
          test -f /tmp/spatial-source/android/app/src/main/java/com/sirpaul/spatialarcoop/ArActivity.kt

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/spatial-source/ ./
          chmod +x android/gradlew scripts/*.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish cooperative spatial AR demo [skip ci]'
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test relay and map server
        working-directory: server
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check

      - name: Build relay/map server container
        run: docker build --tag spatial-ar-coop-server:verified server

      - name: Test Android code and assemble debug APK
        working-directory: android
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY || 'UNCONFIGURED' }}
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL || 'http://192.168.1.10:8080' }}
          DEFAULT_API_TOKEN: ${{ secrets.DEFAULT_API_TOKEN || '' }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Prepare distributable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          cp "$apk" dist/spatial-ar-coop-debug.apk
          sha256sum dist/spatial-ar-coop-debug.apk > dist/spatial-ar-coop-debug.apk.sha256
          cat > dist/BUILD.txt <<EOF
          Spatial AR Coop verified debug build
          Repository commit: $(git rev-parse HEAD)
          Server tests: passed
          Docker image build: passed
          Android unit tests: passed
          Android debug APK build: passed
          EOF

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ar-coop-debug-apk
          retention-days: 90
          if-no-files-found: error
          path: dist/*

      - name: Remove transport-only bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f RECOVERY_NOTES.md
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-v2.yml
          rm -f .github/workflows/recover-bootstrap.yml
          rm -f .github/workflows/diagnose-archive.yml
          rm -f .github/workflows/cleanup-bootstrap.yml
          rm -f .github/workflows/cleanup-bootstrap-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove source transport files [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publish or replace stable demo release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          target="$(git rev-parse origin/main)"
          gh release delete demo-latest --cleanup-tag --yes || true
          gh release create demo-latest dist/* \
            --target "$target" \
            --title 'Spatial AR Coop - latest verified demo' \
            --notes 'Automated verified demo build. Relay tests, Docker build, Android unit tests and debug APK assembly completed successfully.' \
            --prerelease
