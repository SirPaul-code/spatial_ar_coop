name: Server container

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build self-hosted relay/map server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          tags: spatial-ar-coop-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
