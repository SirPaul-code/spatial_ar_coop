name: Apply v1.0.4 field sync patch

"on":
  push:
    branches:
      - "fix/field-sync-v104"
    paths:
      - ".github/workflows/apply-field-sync-v104.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/field-sync-v104
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply_field_sync_v104.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "fix(android): harden field localization and shared tracks"
          git push origin HEAD:fix/field-sync-v104
      - name: Remove one-shot patch files
        run: |
          git rm .github/workflows/apply-field-sync-v104.yml scripts/apply_field_sync_v104.py
          git commit -m "chore: remove v1.0.4 patch helpers"
          git push origin HEAD:fix/field-sync-v104
