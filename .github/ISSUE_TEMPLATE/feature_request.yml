name: Feature request
description: Propose a measurable extension
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Measurable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Suggested design and trade-offs
