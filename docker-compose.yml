services:
  spatial-server:
    build:
      context: ./server
    image: spatial-ar-coop-server:local
    restart: unless-stopped
    ports:
      - "${SPATIAL_BIND_IP:-127.0.0.1}:${SPATIAL_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SPATIAL_SERVER_ID: ${SPATIAL_SERVER_ID:-}
      SPATIAL_SERVER_NAME: ${SPATIAL_SERVER_NAME:-Spatial AR Server}
      SPATIAL_PUBLIC_URL: ${SPATIAL_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRACK_TTL_MS: ${TRACK_TTL_MS:-1800}
      MAX_SCAN_CHUNK_BYTES: ${MAX_SCAN_CHUNK_BYTES:-8388608}
    volumes:
      - spatial-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  spatial-data:
