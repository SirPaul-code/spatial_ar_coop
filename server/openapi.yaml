openapi: 3.1.0
info:
  title: Spatial AR Coop API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      responses:
        '200': { description: Healthy }
  /api/v1/maps:
    get:
      responses:
        '200': { description: Map list }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                createdBy: { type: string }
      responses:
        '201': { description: Map created }
  /api/v1/maps/{mapId}:
    parameters:
      - in: path
        name: mapId
        required: true
        schema: { type: string }
    get:
      responses:
        '200': { description: Map }
    patch:
      responses:
        '200': { description: Updated map }
    delete:
      responses:
        '200': { description: Deleted map }
  /api/v1/maps/{mapId}/anchors:
    post:
      parameters:
        - in: path
          name: mapId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Anchor upserted }
  /api/v1/maps/{mapId}/scan-chunks:
    post:
      parameters:
        - in: path
          name: mapId
          required: true
          schema: { type: string }
        - in: header
          name: X-Chunk-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Device-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '201': { description: Chunk stored }
